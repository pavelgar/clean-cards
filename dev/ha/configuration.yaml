# Config for the local Home Assistant started by `bun run ha`.
# This folder is mounted as its /config; everything it writes here is gitignored.

default_config:

# Fake lights, sensors, climate, media players etc. to put on cards.
demo:

# Entities whose state is easy to flip by hand.
input_boolean:
  dev_toggle:
    name: Dev toggle

input_number:
  dev_level:
    name: Dev level
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

lovelace:
  # Load the cards from the Vite dev server (`bun run dev`).
  resource_mode: yaml
  resources:
    - url: http://localhost:5173/src/clean-cards.ts
      type: module
  dashboards:
    clean-cards:
      mode: yaml
      filename: dashboards/clean-cards.yaml
      title: Clean Cards
      icon: mdi:card-outline
